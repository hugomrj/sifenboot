<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="tx-light"
      data-tenant-style="teal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifenboot · Iniciar Sesión</title>

    <!-- Fuente display de Clay -->
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 4.7 (requerido por Clay) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Clay CSS (librería) -->
    <link rel="stylesheet" th:href="@{/css/clay.css}" href="/css/clay.css">

    <!-- App CSS (layout específico) -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

    <!-- HTMX -->
    <script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js"></script>

    <!-- Scripts propios -->
    <script th:src="@{/js/clay-theme.js}" defer></script>
    <script th:src="@{/js/ui-utils.js}"></script>
    <script th:src="@{/js/auth.js}"></script>

    <!-- Anti-FOUC: aplicar theme ANTES de renderizar el body -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('tx-theme') || 'light';
                var s = localStorage.getItem('tx-style');
                var cls = 'tx-' + t;
                if (s && s !== 'teal') cls += ' tx-' + s;
                document.documentElement.className = cls;
            } catch (e) {
                document.documentElement.className = 'tx-light';
            }
        })();
    </script>
</head>
<body>

<div class="login-shell">
    <div class="login-card fade-in">

        <div class="login-brand">
            <span class="clay-brand-mark">SB</span>
            <h1 class="login-title">Sifenboot</h1>
            <p class="login-subtitle">Iniciar sesión en el panel</p>
        </div>

        <form id="loginForm" autocomplete="off" class="login-form">
            <div class="clay-field">
                <label for="username" class="clay-label">Usuario</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="clay-input"
                       placeholder="usuario"
                       required
                       autofocus>
            </div>

            <div class="clay-field">
                <label for="password" class="clay-label">Contraseña</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="clay-input"
                       placeholder="••••••••"
                       required>
            </div>

            <button type="submit"
                    class="clay-btn clay-btn--primary clay-btn--lg clay-btn--block">
                <span class="fa fa-sign-in"></span>
                Ingresar al Sistema
            </button>
        </form>

        <p class="login-foot">
            Sifenboot · <span class="clay-muted">v1.0.0-SNAPSHOT</span>
        </p>
    </div>
</div>

<script type="module">
    const form = document.getElementById('loginForm');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Deshabilitar botón mientras se envía (evita doble submit)
        submitBtn.disabled = true;
        const originalHTML = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="fa fa-spinner fa-spin"></span> Ingresando...';

        const data = Object.fromEntries(new FormData(form));

        try {
            const response = await fetch('/app/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const user = await response.json();
                localStorage.setItem('token', user.accessToken);

                if (typeof showAlert === 'function') {
                    showAlert('¡Bienvenido! Iniciando sesión...', 'success');
                }

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 800);
            } else {
                // Restaurar botón
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHTML;

                let errorMsg = 'Usuario o contraseña incorrectos';
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.message || errorMsg;
                } catch (e) { /* respuesta no JSON */ }

                if (typeof showAlert === 'function') {
                    showAlert(errorMsg, 'error');
                } else {
                    console.error(errorMsg);
                }
            }
        } catch (err) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalHTML;

            if (typeof showAlert === 'function') {
                showAlert('Error de conexión con el servidor Sifenboot', 'error');
            }
            console.error("Error en la petición:", err);
        }
    });

    // Inicializar theme (lee data-tenant-style del <html>)
    document.addEventListener('DOMContentLoaded', function () {
        if (window.clayTheme) {
            var tenantStyle = document.documentElement.dataset.tenantStyle || 'teal';
            window.clayTheme.init(tenantStyle);
        }
    });
</script>

</body>
</html>

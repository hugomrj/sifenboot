<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="tx-light"
      data-tenant-style="teal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifenboot · Dashboard</title>

    <!-- Fuente display de Clay -->
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 4.7 (usado por theme switcher y botones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Choices.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

    <!-- Clay CSS (librería) -->
    <link rel="stylesheet" th:href="@{/css/clay.css}" href="/css/clay.css">

    <!-- App CSS (layout) -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

    <!-- HTMX -->
    <script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js"></script>

    <!-- Choices.js -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <!-- Scripts propios -->
    <script th:src="@{/js/clay-theme.js}" defer></script>
    <script th:src="@{/js/ui-utils.js}"></script>
    <script th:src="@{/js/auth.js}"></script>

    <!-- Anti-FOUC -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('tx-theme') || 'light';
                var s = localStorage.getItem('tx-style');
                var cls = 'tx-' + t;
                if (s && s !== 'teal') cls += ' tx-' + s;
                document.documentElement.className = cls;
            } catch (e) {
                document.documentElement.className = 'tx-light';
            }
        })();
    </script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<header class="top-navbar">
    <div class="navbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <span class="clay-brand-mark">SB</span>
        <div class="navbar-logo">Sifenboot</div>
    </div>

    <div class="navbar-right">
        <!-- Toggle modo claro/oscuro -->
        <button type="button"
                class="clay-btn clay-btn--icon"
                id="quickTheme"
                aria-label="Cambiar modo claro/oscuro">
            <span class="fa fa-moon-o" id="qtIcon"></span>
        </button>

        <!-- Selector de paleta -->
        <div class="clay-theme-switcher">
            <button type="button"
                    class="clay-btn clay-btn--icon"
                    id="quickStyle"
                    aria-label="Cambiar paleta de colores">
                <span class="fa fa-paint-brush"></span>
            </button>

            <div class="clay-theme-menu" id="styleMenu" role="menu">
                <button class="clay-theme-menu-item" data-style="teal" role="menuitem">
                    <span class="clay-theme-dot" style="background:#0e7c76"></span>
                    Teal Clay
                </button>
                <button class="clay-theme-menu-item" data-style="blue" role="menuitem">
                    <span class="clay-theme-dot" style="background:#2563eb"></span>
                    Blue Soft
                </button>
                <button class="clay-theme-menu-item" data-style="violet" role="menuitem">
                    <span class="clay-theme-dot" style="background:#7c3aed"></span>
                    Violet Mist
                </button>
                <button class="clay-theme-menu-item" data-style="rose" role="menuitem">
                    <span class="clay-theme-dot" style="background:#b8324a"></span>
                    Rose Clay
                </button>
                <button class="clay-theme-menu-item" data-style="amber" role="menuitem">
                    <span class="clay-theme-dot" style="background:#92600a"></span>
                    Amber Sand
                </button>
                <button class="clay-theme-menu-item" data-style="grey" role="menuitem">
                    <span class="clay-theme-dot" style="background:#525252"></span>
                    Soft Grey
                </button>

                <div class="clay-theme-menu-divider"></div>

                <button class="clay-theme-menu-item" data-action="reset" role="menuitem">
                    <span class="fa fa-undo" style="width:14px"></span>
                    Usar color del tenant
                </button>
            </div>
        </div>

        <!-- Logout -->
        <a href="#" id="logoutAction"
           class="clay-btn clay-btn--icon"
           title="Cerrar Sesión">
            <span class="fa fa-power-off"></span>
        </a>
    </div>
</header>

<div class="dashboard-layout">

    <aside class="sidebar" id="sidebar">
        <nav>
            <div class="nav-content">
                <div class="nav-group">
                    <a href="/dashboard" class="nav-item active">
                        Inicio
                    </a>
                </div>

                <div class="nav-group">
                    <div class="nav-item toggle-submenu">
                        <span>Empresas Emisoras</span>
                        <svg class="nav-arrow" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </div>
                    <div class="nav-sub-list">
                        <a href="javascript:void(0)"
                           hx-get="/app/emisores/view/list"
                           hx-target="#main-content"
                           hx-swap="innerHTML"
                           class="nav-sub-item">
                            Listado de Empresas
                        </a>

                        <a href="javascript:void(0)"
                           hx-get="/app/certificados/view/form"
                           hx-target="#main-content"
                           class="nav-sub-item">
                            Certificado Digital
                        </a>

                        <a href="javascript:void(0)"
                           hx-get="/app/schema/usuarios/view"
                           hx-target="#main-content"
                           hx-swap="innerHTML"
                           class="nav-sub-item">
                            Gestión de Usuarios
                        </a>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-item toggle-submenu">
                        <span>Comprobantes</span>
                        <svg class="nav-arrow" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </div>
                    <div class="nav-sub-list">
                        <a href="/emisor/0/documentos"
                           hx-get="/emisor/0/documentos"
                           hx-target="#main-content"
                           class="nav-sub-item">
                            Documentos
                        </a>
                    </div>
                </div>

                <div class="nav-group">
                    <a href="/swagger-ui/index.html" target="_blank" class="nav-item">
                        <span>Documentación API</span>
                        <span class="fa fa-code"></span>
                    </a>
                </div>
            </div>

            <div class="nav-bottom"></div>
        </nav>
    </aside>

    <main class="main-content"
          id="main-content"
          hx-get="/emisor/resumen"
          hx-trigger="load"
          hx-swap="innerHTML">
    </main>

</div>

<!-- CSRF para HTMX -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('htmx:configRequest', (event) => {
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            if (token && header) {
                event.detail.headers[header] = token;
            }
        });
    });
</script>

<!-- Sidebar + logout + submenús -->
<script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');
    const overlay = document.getElementById('sidebarOverlay');

    menuToggle.addEventListener('click', () => {
        if (window.innerWidth > 800) {
            sidebar.classList.toggle('is-hidden');
            mainContent.classList.toggle('expanded');
        } else {
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('is-active');
        }
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('mobile-open');
        overlay.classList.remove('is-active');
    });

    document.addEventListener('click', (event) => {
        const toggleBtn = event.target.closest('.toggle-submenu');
        if (toggleBtn) {
            const parent = toggleBtn.parentElement;
            parent.classList.toggle('is-open');
            return;
        }

        const navLink = event.target.closest('#sidebar a');
        if (navLink) {
            if (overlay && overlay.classList.contains('is-active')) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('is-active');
            }
        }
    });

    // Logout
    const logoutBtn = document.getElementById('logoutAction');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (typeof Auth !== 'undefined') {
                Auth.logout();
            } else {
                console.error("Error: auth.js no se cargó correctamente.");
                window.location.href = '/login';
            }
        });
    }
</script>

<!-- Puente para alertas HTMX -->
<script>
    document.body.addEventListener("showAlert", function (event) {
        if (typeof showAlert === 'function') {
            showAlert(event.detail.message, event.detail.type);
        }
    });
</script>

<!-- Init del theme -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.clayTheme) {
            var tenantStyle = document.documentElement.dataset.tenantStyle || 'teal';
            window.clayTheme.init(tenantStyle);
        }
    });
</script>

</body>
</html>

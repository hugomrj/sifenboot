<div class="fade-in">

    <!-- Título de la página -->
    <div class="page-header">
        <h2>Resumen de Facturación</h2>
        <p>Totales acumulados por empresa emisora</p>
    </div>

    <!-- Grilla de Tarjetas -->
    <div class="grid-3">
        <div class="clay-card clay-card--stat" th:each="s : ${stats}">

            <div class="stat-header">
                <div class="stat-title" th:text="${s.razonSocial}">Razón Social</div>
                <div class="stat-subtitle" th:text="${s.nombreFantasia}">Nombre Fantasía</div>
            </div>

            <div class="stat-body">
                <span class="stat-label">Total Facturado</span>
                <div class="stat-value">
                    <span th:text="${#numbers.formatDecimal(s.totalFacturado, 1, 'POINT', 0, 'COMMA')}">0</span>
                    <small>GS</small>
                </div>
            </div>

            <div class="stat-footer">
                <!-- Asumiendo que querés ir a los documentos de este emisor -->
                <a th:href="@{/emisor/{cod}/documentos(cod=${s.codEmisor})}" class="stat-link">
                    Detalle <span class="fa fa-arrow-right"></span>
                </a>
            </div>

        </div>
    </div>

    <!-- Empty state (por si no hay emisores) -->
    <div th:if="${#lists.isEmpty(stats)}" class="clay-card" style="text-align: center; padding: 40px; color: var(--clay-ink-2);">
        <span class="fa fa-chart-pie" style="font-size: 32px; margin-bottom: 12px; opacity: 0.5;"></span>
        <p>No hay datos de facturación disponibles.</p>
    </div>

</div>

<div id="emisor-form-container" class="clay-card fade-in">

    <div class="form-header">
        <h2 th:text="${titulo}">Nuevo Emisor</h2>
        <p>Datos fiscales y comerciales de la empresa</p>
    </div>

    <form hx-post="/app/emisores/view/save"
          hx-target="#main-content"
          th:object="${emisor}"
          autocomplete="off">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{configuracion.id}">

        <!-- RUC + DV / Código -->
        <div class="grid-2">
            <div class="clay-field">
                <label class="clay-label">RUC y DV</label>
                <div class="form-ruc-row">
                    <input type="text" th:field="*{ruc}"
                           class="clay-input ruc-input"
                           placeholder="80000000"
                           th:readonly="${readOnly}" required>
                    <span class="dv-separator">-</span>
                    <input type="number" th:field="*{rucDv}"
                           class="clay-input dv-input"
                           placeholder="0" min="0" max="9"
                           th:readonly="${readOnly}" required>
                </div>
            </div>
            <div class="clay-field">
                <label class="clay-label">Código (identificador API)</label>
                <input type="text" th:field="*{codEmisor}"
                       class="clay-input"
                       placeholder="sinespacios"
                       th:readonly="${readOnly}" required>
            </div>
        </div>

        <!-- Razón Social -->
        <div class="clay-field">
            <label class="clay-label">Razón Social</label>
            <input type="text" th:field="*{razonSocial}"
                   class="clay-input"
                   placeholder="Nombre legal de la empresa"
                   th:readonly="${readOnly}" required>
        </div>

        <!-- Nombre Fantasía -->
        <div class="clay-field">
            <label class="clay-label">Nombre Fantasía</label>
            <input type="text" th:field="*{nombreFantasia}"
                   class="clay-input"
                   placeholder="Nombre comercial"
                   th:readonly="${readOnly}">
        </div>

        <!-- Tipo Contribuyente / Timbrado / Fecha -->
        <div class="grid-3">
            <div class="clay-field">
                <label class="clay-label">Tipo Contribuyente</label>
                <select th:field="*{tipoContribuyente}"
                        class="clay-select"
                        th:disabled="${readOnly}">
                    <option value="1">Persona Física</option>
                    <option value="2">Persona Jurídica</option>
                </select>
            </div>
            <div class="clay-field">
                <label class="clay-label">Timbrado N°</label>
                <input type="text" th:field="*{numeroTimbrado}"
                       class="clay-input"
                       placeholder="12345678"
                       th:readonly="${readOnly}" required>
            </div>
            <div class="clay-field">
                <label class="clay-label">Fecha inicio</label>
                <input type="date" th:field="*{fechaInicioTimbrado}"
                       class="clay-input"
                       th:readonly="${readOnly}" required>
            </div>
        </div>

        <!-- Dirección + N° Casa -->
        <div class="grid-direccion">
            <div class="clay-field">
                <label class="clay-label">Dirección Calle</label>
                <input type="text" th:field="*{direccion}"
                       class="clay-input"
                       placeholder="Calle principal"
                       th:readonly="${readOnly}" required>
            </div>
            <div class="clay-field">
                <label class="clay-label">N° Casa</label>
                <input type="number" th:field="*{numeroCasa}"
                       class="clay-input"
                       placeholder="123"
                       th:readonly="${readOnly}" required>
            </div>
        </div>

        <!-- Ubicación Geográfica -->
        <div class="grid-3">
            <div class="clay-field">
                <label class="clay-label">Departamento</label>
                <select th:field="*{departamento.id}"
                        id="departamento"
                        class="clay-select"
                        th:disabled="${readOnly}"
                        required
                        hx-get="/app/common/geo/distritos"
                        hx-trigger="change"
                        hx-target="#distrito"
                        hx-swap="innerHTML">
                    <option value="">-- Seleccione --</option>
                    <option th:each="d : ${departamentos}"
                            th:value="${d.id}"
                            th:text="${d.descripcion}"></option>
                </select>
            </div>

            <div class="clay-field">
                <label class="clay-label">Distrito</label>
                <select th:field="*{distrito.id}"
                        id="distrito"
                        class="clay-select"
                        th:disabled="${readOnly}"
                        required
                        hx-get="/app/common/geo/localidades"
                        hx-trigger="change"
                        hx-target="#localidad"
                        hx-swap="innerHTML">
                    <option value="">-- Seleccione --</option>
                    <option th:each="d : ${distritos}"
                            th:value="${d.id}"
                            th:text="${d.descripcion}"></option>
                </select>
            </div>

            <div class="clay-field">
                <label class="clay-label">Ciudad/Localidad</label>
                <select th:field="*{localidad.id}"
                        id="localidad"
                        class="clay-select"
                        th:disabled="${readOnly}"
                        required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="l : ${localidades}"
                            th:value="${l.id}"
                            th:text="${l.descripcion}"></option>
                </select>
            </div>
        </div>

        <!-- Teléfono + Email -->
        <div class="grid-2">
            <div class="clay-field">
                <label class="clay-label">Teléfono</label>
                <input type="tel" th:field="*{telefono}"
                       class="clay-input"
                       placeholder="021 123456"
                       th:readonly="${readOnly}">
            </div>
            <div class="clay-field">
                <label class="clay-label">Email</label>
                <input type="email" th:field="*{email}"
                       class="clay-input"
                       placeholder="contacto@empresa.com"
                       th:readonly="${readOnly}">
            </div>
        </div>

        <!-- Actividad Económica -->
        <div class="grid-actividad">
            <div class="clay-field">
                <label class="clay-label">Cód. Actividad</label>
                <input type="number" th:field="*{actividadEconomicaCodigo}"
                       class="clay-input"
                       placeholder="62010"
                       th:readonly="${readOnly}" required>
            </div>
            <div class="clay-field">
                <label class="clay-label">Descripción Actividad</label>
                <input type="text" th:field="*{actividadEconomicaDescripcion}"
                       class="clay-input"
                       placeholder="Rubro de la empresa"
                       th:readonly="${readOnly}" required>
            </div>
        </div>

        <!-- Configuración SIFEN -->
        <div class="form-section-sifen">
            <h4 class="section-title">
                <span class="fa fa-cog"></span>
                Configuración Técnica SIFEN
            </h4>

            <div class="grid-3">
                <div class="clay-field">
                    <label class="clay-label">Ambiente</label>
                    <select th:field="*{configuracion.ambiente}"
                            class="clay-select"
                            th:disabled="${readOnly}">
                        <option value="test">Test (Pruebas)</option>
                        <option value="prod">Producción</option>
                    </select>
                </div>
                <div class="clay-field">
                    <label class="clay-label">ID CSC (SET)</label>
                    <input type="text" th:field="*{configuracion.idCsc}"
                           class="clay-input"
                           placeholder="0001"
                           th:readonly="${readOnly}">
                </div>
                <div class="clay-field">
                    <label class="clay-label">CSC</label>
                    <input type="text" th:field="*{configuracion.csc}"
                           class="clay-input"
                           th:readonly="${readOnly}">
                </div>
            </div>

            <div class="grid-2">
                <div class="clay-field">
                    <label class="clay-label">API Token (Seguridad)</label>
                    <input type="text" th:field="*{configuracion.apiToken}"
                           class="clay-input"
                           placeholder="token api"
                           th:readonly="${readOnly}">
                </div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="form-actions-row">
            <button type="button"
                    hx-get="/app/emisores/view/list"
                    hx-target="#main-content"
                    class="clay-btn clay-btn--ghost">
                <span class="fa fa-arrow-left"></span>
                <span th:text="${readOnly} ? 'Volver' : 'Cancelar'">Cancelar</span>
            </button>
            <button type="submit"
                    class="clay-btn clay-btn--primary"
                    th:if="${readOnly == null || !readOnly}">
                <span class="fa fa-save"></span>
                Guardar Configuración
            </button>
        </div>
    </form>
</div>

<script>
    window.departamentoChoices = window.departamentoChoices || null;
    window.distritoChoices = window.distritoChoices || null;
    window.localidadChoices = window.localidadChoices || null;

    function initChoices() {
        const departamento = document.querySelector('#departamento');
        const distrito = document.querySelector('#distrito');
        const localidad = document.querySelector('#localidad');

        if (departamento) {
            try {
                if (window.departamentoChoices) window.departamentoChoices.destroy();
            } catch (e) { /* instancia huérfana tras htmx swap */ }
            window.departamentoChoices = new Choices(departamento, {
                searchEnabled: true,
                itemSelectText: '',
                shouldSort: false
            });
        }

        if (distrito) {
            try {
                if (window.distritoChoices) window.distritoChoices.destroy();
            } catch (e) { /* idem */ }
            window.distritoChoices = new Choices(distrito, {
                searchEnabled: true,
                itemSelectText: '',
                shouldSort: false
            });
        }

        if (localidad) {
            try {
                if (window.localidadChoices) window.localidadChoices.destroy();
            } catch (e) { /* idem */ }
            window.localidadChoices = new Choices(localidad, {
                searchEnabled: true,
                itemSelectText: '',
                shouldSort: false
            });
        }
    }

    initChoices();

    // Bind único (evita listeners duplicados si el form se carga varias veces)
    if (!window._choicesHtmxBound) {
        window._choicesHtmxBound = true;
        document.body.addEventListener('htmx:afterSwap', initChoices);
    }
</script>

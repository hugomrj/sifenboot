<div class="card fade-in">
    <div class="card-header">

        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 w-full">

            <div>
                <h3 class="card-title text-2xl font-bold text-[var(--brand-primary)]">
                    Lista de Emisores
                </h3>

                <p class="card-subtitle text-[#666]">
                    Contribuyentes habilitados para la plataforma Sifenboot
                </p>
            </div>

            <button
                    class="btn"
                    hx-get="/app/emisores/view/create"
                    hx-swap="innerHTML"
                    hx-target="#main-content">
                Agregar Emisor
            </button>


        </div>

    </div>

    <div class="table-container">
        <table class="table-flat">
            <thead>
            <tr style="border-bottom: 2px solid var(--brand-secondary);">
                <th>Contribuyente</th>
                <th>Actividad Económica</th>
                <th>Ubicación</th>
                <th>Timbrado</th>
                <th class="text-right">Acciones</th>
            </tr>
            </thead>

            <tbody id="tabla-datos">
            <tr th:each="e : ${emisores}" style="border-bottom: 1px solid var(--brand-secondary);">
                <td>
                    <div class="text-stack">
                        <div class="text-primary font-bold" style="color: var(--brand-primary); font-size: 1rem;" th:text="${e.razonSocial}"></div>
                        <div class="text-secondary" style="display: flex; gap: 8px; align-items: center; margin-top: 2px; font-size: 0.85rem;">
                            <span class="font-bold" th:text="${e.ruc + '-' + e.rucDv}"></span>
                            <span style="color: #CCC;">|</span>
                            <span  style="font-size: 1rem;  color: var(--brand-accent);" th:text="${e.codEmisor}"></span>
                        </div>
                        <div class="text-muted text-italic" style="font-size: 0.9rem; color: #777;"
                             th:if="${e.nombreFantasia != null && !e.nombreFantasia.empty}"
                             th:text="${e.nombreFantasia}">
                        </div>
                    </div>
                </td>

                <td style="max-width: 250px;">
                    <div class="text-stack">
                        <div style="font-family: monospace; font-weight: bold; color: var(--brand-primary); font-size: 0.85rem;"
                             th:text="${e.actividadEconomicaCodigo}"></div>
                        <div style="font-size: 0.75rem; color: #666; line-height: 1.2; text-transform: uppercase;"
                             th:text="${e.actividadEconomicaDescripcion}"></div>
                    </div>
                </td>


                <td>
                    <div class="text-stack">
                        <!-- 1. Departamento -->
                        <div class="font-medium" style="color: var(--brand-primary); font-size: 0.9rem;"
                             th:text="${e.departamento != null ? e.departamento.descripcion : 'SIN DEP.'}"></div>

                        <!-- 2. Distrito / Localidad (NUEVA LÍNEA INTERMEDIA) -->
                        <div th:with="dNom=${e.distrito?.descripcion}, lNom=${e.localidad?.descripcion}"
                             th:if="${dNom != null or lNom != null}"
                             style="font-size: 0.8rem; color: #555;">

                            <!-- Muestra "Distrito - Localidad" si son diferentes, o solo uno si son iguales/nulos -->
                            <span th:text="${(dNom != null and lNom != null and dNom != lNom) ? (dNom + ' - ' + lNom) : (dNom != null ? dNom : lNom)}"></span>
                        </div>

                        <!-- 3. Dirección -->
                        <div style="font-size: 0.8rem; color: #888;">
                            <span th:text="${e.direccion}"></span>
                            <span th:if="${e.numeroCasa != null and e.numeroCasa > 0}" th:text="${' N° ' + e.numeroCasa}"></span>
                        </div>
                    </div>
                </td>


                <td>
                    <div class="text-stack">
                        <div style="font-family: monospace; font-weight: bold; color: var(--brand-primary);" th:text="${e.numeroTimbrado}"></div>
                        <div style="font-size: 0.75rem; color: #888;">
                            <span th:text="${#temporals.format(e.fechaInicioTimbrado, 'dd/MM/yyyy')}"></span>
                        </div>
                    </div>
                </td>



                <td class="text-right">
                    <div class="flex justify-end gap-2">
                        <div class="flex justify-end gap-3">

                            <button class="table-detail"
                                    th:attr="hx-get=@{/app/emisores/view/details/{id}(id=${e.id})}"
                                    hx-target="#main-content">
                                Ver
                            </button>

                            <button class="table-edit"
                                    th:attr="hx-get=@{/app/emisores/view/edit/{id}(id=${e.id})}"
                                    hx-target="#main-content">
                                Editar
                            </button>

                            <button class="table-danger"
                                    th:attr="hx-delete=@{/app/emisores/view/delete/{id}(id=${e.id})}"
                                    hx-confirm="¿Eliminar emisor?"
                                    hx-target="#main-content">
                                Borrar
                            </button>

                        </div>


                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

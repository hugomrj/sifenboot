<div class="clay-card fade-in">

    <!-- Header de la Tarjeta -->
    <div class="list-header">
        <div>
            <h3 class="clay-card-title">Lista de Emisores</h3>
            <p class="clay-card-subtitle">
                Contribuyentes habilitados para la plataforma Sifenboot
            </p>
        </div>

        <button class="clay-btn clay-btn--primary"
                hx-get="/app/emisores/view/create"
                hx-swap="innerHTML"
                hx-target="#main-content">
            <span class="fa fa-plus"></span>
            Agregar Emisor
        </button>
    </div>

    <!-- Contenedor interno de la tabla -->
    <div class="table-wrapper-pro">
        <div class="clay-table-scroll">
            <table class="clay-table">
                <thead>
                <tr>
                    <th>Contribuyente</th>
                    <th>Actividad Económica</th>
                    <th>Ubicación</th>
                    <th>Timbrado</th>
                    <th class="is-actions">Acciones</th>
                </tr>
                </thead>

                <tbody id="tabla-datos">
                <tr th:each="e : ${emisores}">
                    <td>
                        <div class="text-stack">
                            <div class="text-primary" th:text="${e.razonSocial}"></div>
                            <div class="text-secondary">
                                <span class="text-strong" th:text="${e.ruc + '-' + e.rucDv}"></span>
                                <span class="text-sep">|</span>
                                <span class="text-accent" th:text="${e.codEmisor}"></span>
                            </div>
                            <div class="text-muted text-italic text-sm"
                                 th:if="${e.nombreFantasia != null && !e.nombreFantasia.empty}"
                                 th:text="${e.nombreFantasia}">
                            </div>
                        </div>
                    </td>

                    <td class="cell-max-250">
                        <div class="text-stack">
                            <div class="text-mono" th:text="${e.actividadEconomicaCodigo}"></div>
                            <div class="text-tiny-uppercase" th:text="${e.actividadEconomicaDescripcion}"></div>
                        </div>
                    </td>

                    <td>
                        <div class="text-stack">
                            <div class="text-body-strong"
                                 th:text="${e.departamento != null ? e.departamento.descripcion : 'SIN DEP.'}">
                            </div>

                            <div th:with="dNom=${e.distrito?.descripcion}, lNom=${e.localidad?.descripcion}"
                                 th:if="${dNom != null or lNom != null}"
                                 class="text-body-muted">
                                <span th:text="${(dNom != null and lNom != null and dNom != lNom) ? (dNom + ' - ' + lNom) : (dNom != null ? dNom : lNom)}"></span>
                            </div>

                            <div class="text-tiny">
                                <span th:text="${e.direccion}"></span>
                                <span th:if="${e.numeroCasa != null and e.numeroCasa > 0}"
                                      th:text="${' N° ' + e.numeroCasa}"></span>
                            </div>
                        </div>
                    </td>

                    <td>
                        <div class="text-stack">
                            <div class="text-mono-strong" th:text="${e.numeroTimbrado}"></div>
                            <div class="text-tiny">
                                <span th:text="${#temporals.format(e.fechaInicioTimbrado, 'dd/MM/yyyy')}"></span>
                            </div>
                        </div>
                    </td>





                    <td class="is-actions">
                        <div class="table-actions">
                            <!-- Botón Ver (Azul) -->
                            <button class="clay-btn clay-btn--icon clay-btn--sm action-view"
                                    th:attr="hx-get=@{/app/emisores/view/details/{id}(id=${e.id})}"
                                    hx-target="#main-content"
                                    title="Ver detalles">
                                <span class="fa fa-eye"></span>
                            </button>

                            <!-- Botón Editar (Naranja/Ámbar) -->
                            <button class="clay-btn clay-btn--icon clay-btn--sm action-edit"
                                    th:attr="hx-get=@{/app/emisores/view/edit/{id}(id=${e.id})}"
                                    hx-target="#main-content"
                                    title="Editar emisor">
                                <span class="fa fa-pencil"></span>
                            </button>

                            <!-- Botón Borrar (Rojo) -->
                            <button class="clay-btn clay-btn--icon clay-btn--sm action-delete"
                                    th:attr="hx-delete=@{/app/emisores/view/delete/{id}(id=${e.id})}"
                                    hx-confirm="¿Eliminar emisor?"
                                    hx-target="#main-content"
                                    title="Borrar emisor">
                                <span class="fa fa-trash"></span>
                            </button>
                        </div>
                    </td>




                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(emisores)}">
                    <td colspan="5">
                        <div class="clay-table-empty">
                            <span class="fa fa-users"></span>
                            No hay emisores registrados todavía
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

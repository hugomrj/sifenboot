<div class="fade-in">

    <!-- Botón Agregar -->
    <div class="list-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 16px;">
        <div></div> <!-- Espaciador para empujar el botón a la derecha -->
        <button class="clay-btn clay-btn--primary"
                th:attr="hx-get='/app/schema/usuarios/form?emisorId=' + ${emisorId}"
                hx-target="#main-content">
            <span class="fa fa-plus"></span>
            Agregar Usuario
        </button>
    </div>

    <!-- Tabla -->
    <div class="table-wrapper-pro">
        <div class="clay-table-scroll">
            <table class="clay-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th class="is-actions" style="width: 140px;">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4">
                        <div class="clay-table-empty">
                            <span class="fa fa-user-o"></span>
                            No existen usuarios registrados.
                        </div>
                    </td>
                </tr>

                <!-- Filas -->
                <tr th:each="usuario : ${usuarios}">
                    <td>
                        <span class="text-mono" th:text="${usuario.id}">1</span>
                    </td>

                    <td>
                        <div class="text-stack">
                            <span class="text-primary" th:text="${usuario.username}">admin</span>
                            <span class="text-body-muted">Usuario del esquema</span>
                        </div>
                    </td>

                    <td>
                        <span th:if="${usuario.activo}" class="clay-badge clay-badge--success">
                            Activo
                        </span>
                        <span th:unless="${usuario.activo}" class="clay-badge clay-badge--danger">
                            Inactivo
                        </span>
                    </td>

                    <td class="is-actions">
                        <div class="table-actions">
                            <!-- Editar -->
                            <button class="clay-btn clay-btn--icon action-edit" title="Editar">
                                <span class="fa fa-pencil"></span>
                            </button>

                            <!-- Eliminar -->
                            <button class="clay-btn clay-btn--icon action-delete" title="Eliminar">
                                <span class="fa fa-trash"></span>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Paginación -->
    <div class="clay-pagination">
        <span class="clay-pagination-info">
            Mostrando registros
        </span>

        <ul class="clay-pagination-list">
            <li>
                <span class="is-disabled">
                    <span class="fa fa-chevron-left"></span>
                </span>
            </li>
            <li>
                <span class="is-current">1</span>
            </li>
            <li>
                <span class="is-disabled">
                    <span class="fa fa-chevron-right"></span>
                </span>
            </li>
        </ul>
    </div>

</div>

<div class="clay-card fade-in">

    <!-- Header -->
    <div class="form-header">
        <h2 th:text="${titulo}">Gestión de Usuarios</h2>
    </div>

    <!-- Selector de Empresa -->
    <div class="clay-field" style="margin-bottom: 32px;">
        <label class="clay-label">Seleccionar Empresa</label>
        <select class="clay-select"
                name="emisorId"
                style="max-width: 400px;"
                hx-get="/app/schema/usuarios/list"
                hx-target="#list-container"
                hx-trigger="change">

            <option value="">-- Seleccione una Empresa --</option>

            <option th:each="e : ${emisores}"
                    th:value="${e.id}"
                    th:text="${e.razonSocial}"
                    th:selected="${emisorId != null and e.id == emisorId}">
            </option>
        </select>
    </div>

    <!-- Contenedor de la Lista -->
    <div id="list-container">

        <!-- Si hay emisor seleccionado, carga la lista -->
        <th:block th:if="${emisorId != null}">
            <div th:replace="~{ui/usuarioshema/list}"></div>
        </th:block>

        <!-- Si no hay emisor, muestra el estado vacío -->
        <th:block th:unless="${emisorId != null}">
            <div class="upload-placeholder">
                <span class="fa fa-users"></span>
                <p>Seleccione una empresa para gestionar sus usuarios.</p>
            </div>
        </th:block>

    </div>

</div>

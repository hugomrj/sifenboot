<!-- =========================
     FRAGMENTO PRINCIPAL
     ========================= -->
<div th:fragment="lista-documentos" class="p-6" xmlns:th="http://www.w3.org/1999/xhtml">


    <!-- Toggle oculto para cambiar entre vista cards y tabla -->
    <!-- Se usa con Tailwind peer para aplicar estilos condicionales -->
    <input type="checkbox" id="view-toggle" class="hidden peer">

    <!-- =========================
         HEADER / TÍTULO
         ========================= -->
    <div class="mb-6 pb-6 border-b border-gray-100">

        <!-- fila 1: título + volver -->
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-2xl font-bold text-gray-900">
                Documentos
            </h1>

            <a href="/emisor/resumen"
               hx-get="/emisor/resumen"
               hx-target="#main-content"
               class="link whitespace-nowrap">
                ← Volver
            </a>
        </div>

        <!-- fila 2: select + botón -->
        <div class="w-full max-w-3xl flex gap-2">
            <select id="emisorSelect"
                    class="flex-1 text-sm border border-gray-200 rounded px-3 py-2 bg-white">

                <option value="0"
                        th:selected="${data.codEmisor == null || data.codEmisor == '0'}">
                    Seleccionar emisor
                </option>

                <option th:each="e : ${emisores}"
                        th:value="${e.codEmisor}"
                        th:selected="${e.codEmisor == data.codEmisor}"
                        th:text="${e.razonSocial}">
                </option>

            </select>


            <button
                    class="btn btn-outline"
                    hx-target="#main-content"
                    hx-trigger="click"
                    hx-on:click="htmx.ajax('GET', '/emisor/' + document.getElementById('emisorSelect').value + '/documentos', {target:'#main-content'})">
                Ver
            </button>


        </div>

    </div>

    <!-- =========================
         SWITCH DE VISTA (CARDS / TABLA)
         ========================= -->
    <div class="flex justify-end mb-6">
        <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-lg">

            <!-- Botón vista CARDS -->
            <!-- Activo por defecto -->
            <label for="view-toggle"
                   class="cursor-pointer p-2 rounded-md transition-all
                          text-gray-500 hover:text-gray-800
                          peer-checked:text-gray-500 peer-checked:bg-transparent peer-checked:shadow-none
                          bg-white shadow-sm text-blue-600">
                <!-- icon grid -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2"
                          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
            </label>

            <!-- Botón vista TABLA -->
            <label for="view-toggle"
                   class="cursor-pointer p-2 rounded-md transition-all
                          text-gray-500 hover:text-gray-800
                          peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-blue-600">
                <!-- icon list -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
            </label>

        </div>
    </div>


    <!-- =========================
         VISTA CARDS
         ========================= -->
    <div class="peer-checked:hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">

        <!-- CARD -->
        <div th:each="doc : ${data.facturas}"
             class="group bg-white rounded-2xl border border-gray-200
                hover:border-blue-200 hover:shadow-xl
                transition-all duration-200 overflow-hidden">

            <!-- HEADER -->
            <div class="px-4 py-3 border-b bg-gray-50">

                <!-- FILA 1: TIPO (Izquierda) y ESTADO (Derecha) -->
                <div class="flex justify-between items-center mb-2"> <!-- Añadido mb-2 para separar de la fila de abajo -->

                    <!-- TIPO -->
                    <div class="text-[11px] text-gray-400 font-medium invisible">
                        Tipo: <span class="text-gray-600" th:text="${doc.tipoDocumento}">1</span>
                    </div>

                    <!-- ESTADO -->
                    <span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded"
                          th:text="${doc.estado.codigo}"
                          th:classappend="${doc.estado.codigo == 'APROBADO'
                          ? 'bg-green-100 text-green-700'
                          : 'bg-blue-100 text-blue-700'}">
                    </span>

                </div>

                <!-- FILA 2: NÚMERO DE DOCUMENTO -->
                <div class="text-base font-bold font-mono text-gray-900 leading-tight"
                     th:text="|${doc.establecimiento}-${doc.puntoExpedicion}-${doc.numeroDocumento}|">
                    <!-- Cambiado leading-none por leading-tight para que no sea tan asfixiante -->
                </div>


            </div>

            <!-- BODY -->
            <div class="p-4">

                <!-- CLIENTE -->
                <div class="mb-4">

                    <div class="text-[10px] uppercase tracking-wide text-gray-400 mb-1">
                        Receptor
                    </div>

                    <h3 class="font-semibold text-gray-900 truncate"
                        th:text="${doc.nombreReceptor}">
                    </h3>

                </div>

                <!-- MONTO -->
                <div class="mb-4">

                    <div class="text-[10px] uppercase tracking-wide text-gray-400 mb-1">
                        Monto
                    </div>

                        <div class="text-xl font-bold text-gray-900">
                            Gs.
                            <span th:text="${#numbers.formatDecimal(doc.montoTotal, 0, 'POINT', 0, 'COMMA')}"></span>
                        </div>

                </div>



                <!-- FOOTER -->
                <div class="pt-3 border-t flex justify-between items-end">

                    <!-- FECHA -->
                    <div>
                        <div class="text-[10px] text-gray-400">
                            Emisión
                        </div>

                        <div class="text-xs text-gray-700"
                             th:text="${#temporals.format(doc.fechaEmision, 'dd/MM/yyyy HH:mm')}">
                        </div>
                    </div>


                </div>

            </div>

        </div>

    </div>

    <!-- =========================
         VISTA TABLA
         ========================= -->
    <div class="hidden peer-checked:block bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <!-- HEADER -->
                <thead class="bg-gray-50 border-b border-gray-200 text-gray-700 uppercase text-xs">
                <tr>
                    <th class="px-6 py-4">Identificación del Documento</th>
                    <th class="px-6 py-4">Receptor</th>
                    <th class="px-6 py-4">Fecha</th>
                    <th class="px-6 py-4">Estado</th>
                    <th class="px-6 py-4 text-right">Monto</th>
                </tr>
                </thead>

                <!-- BODY -->
                <tbody class="divide-y divide-gray-100">
                <tr th:each="doc : ${data.facturas}" class="hover:bg-gray-50 transition-colors">

                    <!-- DOCUMENTO + CDC UNIFICADOS -->
                    <td class="px-6 py-4">
                        <!-- Nro de Factura -->
                        <div class="flex items-center gap-2">
                            <span class="font-mono font-bold text-gray-900 text-base"
                                  th:text="|${doc.establecimiento}-${doc.puntoExpedicion}-${doc.numeroDocumento}|">
                            </span>
                            <span class="text-[10px] px-1.5 py-0.5 bg-gray-100 text-gray-500 rounded font-medium"
                                  th:text="${doc.tipoDocumento}">
                            </span>
                        </div>

                        <!-- CDC (Estilo secundario pero accesible) -->
                        <div class="mt-1.5">
                            <div class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">CDC</div>
                            <div class="font-mono text-[11px] text-blue-600/80 break-all leading-tight max-w-[350px]"
                                 th:text="${doc.cdc}">
                            </div>
                        </div>
                    </td>

                    <!-- RECEPTOR -->
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900" th:text="${doc.nombreReceptor}"></div>
                        <div class="text-xs text-gray-500 mt-1" th:text="${doc.rucReceptor}"></div>
                    </td>

                    <!-- FECHA -->
                    <td class="px-6 py-4">
                        <div class="text-gray-700" th:text="${#temporals.format(doc.fechaEmision, 'dd/MM/yyyy')}"></div>
                        <div class="text-xs text-gray-400 mt-0.5" th:text="${#temporals.format(doc.fechaEmision, 'HH:mm')}"></div>
                    </td>

                    <!-- ESTADO -->
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide border"
                              th:text="${doc.estado.codigo}"
                              th:title="${doc.estado.descripcion}"
                              th:classappend="${doc.estado.codigo == 'APROBADO'
                                  ? 'bg-green-50 text-green-700 border-green-200'
                                  : 'bg-blue-50 text-blue-700 border-blue-200'}">
                        </span>
                    </td>

                    <!-- MONTO -->
                    <td class="px-6 py-4 text-right">
                        <div class="font-bold text-gray-900 text-base">
                            Gs. <span th:text="${#numbers.formatDecimal(doc.montoTotal, 0, 'POINT', 0, 'COMMA')}"></span>
                        </div>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

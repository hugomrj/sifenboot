<div th:fragment="lista-documentos" xmlns:th="http://www.w3.org/1999/xhtml" class="fade-in">

    <!-- =========================
         HEADER / TÍTULO
         ========================= -->
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
        <div>
            <h2>Documentos</h2>
            <p>Comprobantes emitidos por la empresa</p>
        </div>

        <a href="/emisor/resumen"
           hx-get="/emisor/resumen"
           hx-target="#main-content"
           class="link">
            <span class="fa fa-arrow-left"></span> Volver
        </a>
    </div>

    <!-- FILTROS -->
    <div class="list-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 24px; flex-direction: row; justify-content: flex-start; align-items: flex-end; gap: 12px; flex-wrap: wrap;">
        <div class="clay-field" style="margin-bottom: 0; width: 100%; max-width: 400px;">
            <label class="clay-label">Emisor</label>
            <select id="emisorSelect" class="clay-select">
                <option value="0" th:selected="${data.codEmisor == null || data.codEmisor == '0'}">
                    Seleccionar emisor
                </option>
                <option th:each="e : ${emisores}"
                        th:value="${e.codEmisor}"
                        th:selected="${e.codEmisor == data.codEmisor}"
                        th:text="${e.razonSocial}">
                </option>
            </select>
        </div>

        <button class="clay-btn clay-btn--primary"
                hx-target="#main-content"
                hx-trigger="click"
                hx-on:click="htmx.ajax('GET', '/emisor/' + document.getElementById('emisorSelect').value + '/documentos', {target:'#main-content'})">
            <span class="fa fa-search"></span> Ver
        </button>
    </div>

    <!-- SWITCH DE VISTA (CARDS / TABLA) -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
        <div class="view-toggle-group">
            <button type="button" id="btn-view-cards" class="view-toggle-btn is-active" onclick="switchDocView('cards')" title="Vista de Tarjetas">
                <span class="fa fa-th-large"></span>
            </button>
            <button type="button" id="btn-view-table" class="view-toggle-btn" onclick="switchDocView('table')" title="Vista de Tabla">
                <span class="fa fa-list"></span>
            </button>
        </div>
    </div>

    <!-- =========================
         VISTA CARDS
         ========================= -->
    <div id="view-cards" class="documents-grid">

        <div th:each="doc : ${data.facturas}" class="clay-card document-card">

            <!-- Card Header -->
            <div class="doc-card-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <div class="text-tiny text-muted" style="visibility: hidden;">
                        Tipo: <span th:text="${doc.tipoDocumento}">1</span>
                    </div>
                    <span class="clay-badge"
                          th:text="${doc.estado.codigo}"
                          th:classappend="${doc.estado.codigo == 'APROBADO' ? 'clay-badge--success' : 'clay-badge--info'}"
                          th:title="${doc.estado.descripcion}">
                    </span>
                </div>
                <div class="text-mono-strong" style="font-size: 1.1rem;" th:text="|${doc.establecimiento}-${doc.puntoExpedicion}-${doc.numeroDocumento}|">
                </div>
            </div>

            <!-- Card Body -->
            <div class="doc-card-body">
                <div class="doc-field">
                    <div class="doc-label">Receptor</div>
                    <div class="text-primary" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${doc.nombreReceptor}"></div>
                </div>

                <div class="doc-field">
                    <div class="doc-label">Monto</div>
                    <div class="text-primary" style="font-size: 1.25rem;">
                        Gs. <span th:text="${#numbers.formatDecimal(doc.montoTotal, 0, 'POINT', 0, 'COMMA')}"></span>
                    </div>
                </div>
            </div>

            <!-- Card Footer -->
            <div class="doc-card-footer">
                <div>
                    <div class="doc-label">Emisión</div>
                    <div class="text-secondary" th:text="${#temporals.format(doc.fechaEmision, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
            </div>

        </div>

        <!-- Empty State Cards -->
        <div th:if="${#lists.isEmpty(data.facturas)}" style="grid-column: 1 / -1;">
            <div class="clay-table-empty">
                <span class="fa fa-file-text-o"></span>
                No hay documentos para mostrar.
            </div>
        </div>
    </div>

    <!-- =========================
         VISTA TABLA
         ========================= -->
    <div id="view-table" class="table-wrapper-pro" style="display: none;">
        <div class="clay-table-scroll">
            <table class="clay-table">
                <thead>
                <tr>
                    <th>Identificación</th>
                    <th>Receptor</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th class="is-numeric">Monto</th>
                </tr>
                </thead>

                <tbody>
                <!-- Empty State Table -->
                <tr th:if="${#lists.isEmpty(data.facturas)}">
                    <td colspan="5">
                        <div class="clay-table-empty">
                            <span class="fa fa-file-text-o"></span>
                            No hay documentos para mostrar.
                        </div>
                    </td>
                </tr>

                <!-- Filas -->
                <tr th:each="doc : ${data.facturas}">
                    <!-- Documento + CDC -->
                    <td>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span class="text-mono-strong" th:text="|${doc.establecimiento}-${doc.puntoExpedicion}-${doc.numeroDocumento}|"></span>
                            <span class="clay-badge clay-badge--outline" style="font-size: 0.65rem; padding: 2px 6px;" th:text="${doc.tipoDocumento}"></span>
                        </div>
                        <div>
                            <div class="doc-label" style="margin-bottom: 2px;">CDC</div>
                            <div class="text-mono text-muted" style="font-size: 0.75rem; word-break: break-all; max-width: 320px; line-height: 1.2;" th:text="${doc.cdc}"></div>
                        </div>
                    </td>

                    <!-- Receptor -->
                    <td>
                        <div class="text-primary" th:text="${doc.nombreReceptor}"></div>
                        <div class="text-secondary" style="margin-top: 2px;" th:text="${doc.rucReceptor}"></div>
                    </td>

                    <!-- Fecha -->
                    <td>
                        <div class="text-body-strong" th:text="${#temporals.format(doc.fechaEmision, 'dd/MM/yyyy')}"></div>
                        <div class="text-tiny" style="margin-top: 2px;" th:text="${#temporals.format(doc.fechaEmision, 'HH:mm')}"></div>
                    </td>

                    <!-- Estado -->
                    <td>
                        <span class="clay-badge"
                              th:text="${doc.estado.codigo}"
                              th:title="${doc.estado.descripcion}"
                              th:classappend="${doc.estado.codigo == 'APROBADO' ? 'clay-badge--success' : 'clay-badge--info'}">
                        </span>
                    </td>

                    <!-- Monto -->
                    <td class="is-numeric">
                        <div class="text-primary" style="font-size: 1rem;">
                            Gs. <span th:text="${#numbers.formatDecimal(doc.montoTotal, 0, 'POINT', 0, 'COMMA')}"></span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Script para alternar vistas -->
<script>
    function switchDocView(view) {
        const viewCards = document.getElementById('view-cards');
        const viewTable = document.getElementById('view-table');
        const btnCards = document.getElementById('btn-view-cards');
        const btnTable = document.getElementById('btn-view-table');

        if (view === 'cards') {
            viewCards.style.display = 'grid';
            viewTable.style.display = 'none';
            btnCards.classList.add('is-active');
            btnTable.classList.remove('is-active');
        } else {
            viewCards.style.display = 'none';
            viewTable.style.display = 'block';
            btnTable.classList.add('is-active');
            btnCards.classList.remove('is-active');
        }
    }
</script>
